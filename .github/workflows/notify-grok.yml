name: Notify Grok Bot
run-name: "notify-grok #${{ github.event.issue.number }} (${{ github.event.action }})"

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

jobs:
  notify-grok:
    name: notify-grok
    if: github.event.label.name == 'agent'
    concurrency:
      group: notify-grok-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send issue event to Grok Bot webhook
        env:
          URL: ${{ secrets.GROK_WEBHOOK_URL }}
          AUTH: ${{ secrets.GROK_WEBHOOK_AUTH }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ -z "$URL" ] || [ -z "$AUTH" ]; then
            echo "::notice::Skipping Grok webhook notification: GROK_WEBHOOK_URL or GROK_WEBHOOK_AUTH secret is not set."
            exit 0
          fi
          IDEMPOTENCY_KEY="${{ github.repository }}#${{ github.event.issue.number }}"
          DELIVERY_ID="${{ github.event.issue.number }}-${RUN_ID}-${RUN_ATTEMPT}"
          MODELS_JSON="$(python3 -c "import yaml, json, os; p='models.yml'; d={'builder':'gemini-3.8-flash-high','auditor':'grok-4.7','planner':'gemini-3.8-flash-high','epic_planner':'gemini-3.8-flash-high','subagents':'gemini-3.8-flash-high'}; d.update(yaml.safe_load(open(p)) if os.path.exists(p) else {}); print(json.dumps(d))")"
          jq --arg idempotency_key "$IDEMPOTENCY_KEY" \
             --arg delivery_id "$DELIVERY_ID" \
             --arg run_id "$RUN_ID" \
             --argjson models "$MODELS_JSON" \
             '.idempotency_key = $idempotency_key | .delivery_id = $delivery_id | .run_id = $run_id | .labels = [(.issue.labels // [])[].name] | .models = $models' \
             "$GITHUB_EVENT_PATH" | curl -fsS -X POST "$URL" \
            -H "Authorization: $AUTH" \
            -H "Content-Type: application/json" \
            --data-binary @-
