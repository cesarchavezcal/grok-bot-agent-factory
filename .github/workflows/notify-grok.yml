name: Notify Grok Bot

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: notify-grok-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read

jobs:
  notify-grok:
    name: notify-grok
    if: >-
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'agent')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent' && github.event.issue.created_at != github.event.issue.updated_at)
    runs-on: ubuntu-latest
    steps:
      - name: Send issue event to Grok Bot webhook
        env:
          URL: ${{ secrets.GROK_WEBHOOK_URL }}
          AUTH: ${{ secrets.GROK_WEBHOOK_AUTH }}
        run: |
          if [ -z "$URL" ] || [ -z "$AUTH" ]; then
            echo "::notice::Skipping Grok webhook notification: GROK_WEBHOOK_URL or GROK_WEBHOOK_AUTH secret is not set."
            exit 0
          fi
          jq '.labels = [(.issue.labels // [])[].name]' "$GITHUB_EVENT_PATH" | curl -fsS -X POST "$URL" \
            -H "Authorization: $AUTH" \
            -H "Content-Type: application/json" \
            --data-binary @-
