name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Factory Configuration & Invariants
        run: |
          test -f .factory/config.json
          test -f .factory/work-item.schema.json
          test -f .factory/template-sync.json
          test -f .factory/template-version
          test -f models.allowed.yml
          test -f models.yml
          test -x scripts/sync-template.sh
          bash -n scripts/sync-template.sh
          bash -n scripts/init.sh
          test -x scripts/setup-labels.sh
          bash -n scripts/setup-labels.sh
          test -x scripts/setup-models.sh
          bash -n scripts/setup-models.sh
          test -x scripts/validate_models.py
          test -f skills-lock.json
          test -f AGENTS.md
          python3 scripts/validate_models.py
          node -e '
            const fs = require("fs");
            const rawConfig = fs.readFileSync(".factory/config.json", "utf8");
            const cfg = JSON.parse(rawConfig);

            // Invariant: Zero paid API keys & Claude-free
            if (!cfg.invariants?.strictZeroCost || !cfg.invariants?.disallowClaude) {
              throw new Error("Factory invariants violated in .factory/config.json");
            }
            if (cfg.intake?.requiredLabel !== "agent") {
              throw new Error("intake.requiredLabel must be agent");
            }

            // Invariant: Argon is completely retired and forbidden
            if (/argon/i.test(rawConfig)) {
              throw new Error("Argon model detected in .factory/config.json — Argon is retired and forbidden");
            }

            // Invariant: No argon references in work-item schema or agents or rules
            const rawSchema = fs.readFileSync(".factory/work-item.schema.json", "utf8");
            if (/argon/i.test(rawSchema)) {
              throw new Error("Argon reference detected in .factory/work-item.schema.json");
            }

            for (const agentFile of ["builder-flash.md", "builder-grok.md", "interrogator-grok.md"]) {
              const content = fs.readFileSync(".cursor/agents/" + agentFile, "utf8");
              if (/argon/i.test(content)) {
                throw new Error("Argon reference detected in .cursor/agents/" + agentFile);
              }
            }

            const rawAgents = fs.readFileSync("AGENTS.md", "utf8");
            if (/gemini-4-argon/i.test(rawAgents)) {
              throw new Error("gemini-4-argon reference detected in AGENTS.md");
            }

            const rawRules = fs.readFileSync(".cursor/rules/factory.mdc", "utf8");
            if (/gemini-4-argon/i.test(rawRules)) {
              throw new Error("gemini-4-argon reference detected in .cursor/rules/factory.mdc");
            }

            const syncManifest = JSON.parse(fs.readFileSync(".factory/template-sync.json", "utf8"));
            const requiredPaths = [
              ".factory/template-sync.json",
              ".github/workflows/*",
              "scripts/*",
              ".agents/skills/*",
              ".cursor/rules",
              ".cursor/agents",
              "AGENTS.md",
              "models.allowed.yml"
            ];
            for (const req of requiredPaths) {
              if (!Array.isArray(syncManifest.managedPaths) || !syncManifest.managedPaths.includes(req)) {
                throw new Error("Missing required managed path in .factory/template-sync.json: " + req);
              }
            }
            if (!Array.isArray(syncManifest.preserveLocalPaths) || !syncManifest.preserveLocalPaths.includes("models.yml")) {
              throw new Error("models.yml must be in preserveLocalPaths in .factory/template-sync.json");
            }
            console.log("Factory config, model orchestration, and template-sync manifest invariants OK.");
          '

      - name: Run Factory Python unit tests
        run: |
          python3 -m unittest discover tests

      - name: Run Node.js lint / test / build (if package.json exists)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Execute Node.js checks
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present

      - name: Run Python checks (if pyproject.toml or requirements.txt exists)
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if command -v pytest >/dev/null 2>&1; then pytest; fi

      - name: Run Go checks (if go.mod exists)
        if: hashFiles('go.mod') != ''
        run: |
          go vet ./...
          go test ./...

      - name: Run Rust checks (if Cargo.toml exists)
        if: hashFiles('Cargo.toml') != ''
        run: |
          cargo test
